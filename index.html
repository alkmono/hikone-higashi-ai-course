<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI・データサイエンス講座（全3回）｜近江テック・アカデミー</title>
  <meta name="description" content="彦根東高校のみなさんへ。AI・データサイエンス講座の説明会参加登録、講座申し込み、匿名での質問はこちらから。">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta property="og:title" content="AI・データサイエンス講座（全3回）">
  <meta property="og:description" content="説明会への参加登録、講座への申し込み、匿名での質問、質問への回答をご案内します。">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="config.js" defer></script>
  <script src="main.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="hero">
      <p class="audience-label">彦根東高校のみなさんへ</p>
      <h1>AI・データサイエンス<br class="mobile-break">講座 <span class="nowrap">（全3回）</span></h1>
      <p class="organizer">主催：近江テック・アカデミー</p>
      <div class="rule" aria-hidden="true"></div>
    </header>

    <section class="info-card" aria-labelledby="event-info-heading">
      <h2 id="event-info-heading">開催情報</h2>
      <dl class="event-details">
        <div class="detail-row">
          <dt>講座日程</dt>
          <dd>
            <span>第1回 <span id="course-first"></span>（60分）</span>
            <span>第2・3回 <span id="course-later"></span>（120分）</span>
          </dd>
        </div>
        <div class="detail-row">
          <dt>説明会</dt>
          <dd><span id="briefing-date"></span>（30分）</dd>
        </div>
        <div class="detail-row">
          <dt>場所</dt>
          <dd id="venue"></dd>
        </div>
        <div class="detail-row">
          <dt>定員</dt>
          <dd>10名程度</dd>
        </div>
      </dl>
    </section>

    <nav class="action-list" aria-label="講座の手続きと案内">
      <div class="action-item">
        <a class="action-card" id="briefing-link" target="_blank" rel="noopener noreferrer">
          <span class="action-text">説明会に参加登録する</span><span class="chevron" aria-hidden="true">›</span>
        </a>
        <p class="action-note" id="briefing-note">話を聞いてみるだけでもOK</p>
      </div>
      <div class="action-item">
        <a class="action-card" id="course-link" target="_blank" rel="noopener noreferrer">
          <span class="action-text">講座に申し込む</span><span class="chevron" aria-hidden="true">›</span>
        </a>
        <p class="action-note" id="course-note"></p>
      </div>
      <div class="action-item">
        <a class="action-card" id="question-link" target="_blank" rel="noopener noreferrer">
          <span class="action-text">質問する（匿名OK）</span><span class="chevron" aria-hidden="true">›</span>
        </a>
        <p class="action-note">名前は聞きません。説明会に来られない人もどうぞ</p>
      </div>
      <div class="action-item">
        <a class="action-card" href="qa.html">
          <span class="action-text">みんなの質問と回答を見る</span><span class="chevron" aria-hidden="true">›</span>
        </a>
        <p class="action-note">いただいた質問への回答はここに載せます</p>
      </div>
    </nav>

    <footer class="site-footer">
      <p class="friend-message">友達と一緒の参加も大歓迎！</p>
      <p class="footer-organizer">近江テック・アカデミー</p>
    </footer>
  </main>
</body>
</html>
